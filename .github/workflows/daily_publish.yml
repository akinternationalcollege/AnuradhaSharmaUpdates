name: Live Auto-Generator & Publisher

on:
  schedule:
    - cron: '0 8,20 * * *' # Runs TWICE a day automatically
  workflow_dispatch: # Allows manual trigger

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'
        
    - name: Run True Auto-Generator Script
      run: python true_auto_generator.py
        
    - name: Commit and Push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add .
        git commit -m "Auto-generated live news article for Anuradha Sharma" || echo "No changes to commit"
        git push
